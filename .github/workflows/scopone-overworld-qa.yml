name: Scopone Alchemico QA
on:
  push:
    paths:
      - 'scopone-magico/**'
      - '.github/workflows/scopone-overworld-qa.yml'
  pull_request:
    paths:
      - 'scopone-magico/**'
      - '.github/workflows/scopone-overworld-qa.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Overworld JavaScript
        run: |
          for file in scopone-magico/overworld/engine/*.js; do node --check "$file"; done
      - name: Test isometric scenes, coastline and town transitions
        working-directory: scopone-magico/overworld
        run: npm test
      - name: Regression tests for both Scopone card modes
        run: node scopone-magico/test-engine.js
